name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: provider-sdk-python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked dev environment
        run: uv sync --locked --extra dev
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check . --output-format=github
      - name: Typecheck
        run: uv run mypy

  test:
    name: Tests and conformance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (Raspberry Pi OS Bookworm ships it).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked dev environment
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      # Includes tests/test_conformance.py: the anolis-protocol conformance
      # harness (the release pinned in pyproject's dev extra) against the
      # reference provider, which must pass with no unexpected skips.
      - name: Tests
        run: uv run pytest

  docs:
    name: Docs
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/docs-check.yml@2f08cae7f3b9bfaa817b822e256d9f66b1fdb18d # v2

  ok:
    name: ok
    if: always()
    needs: [check, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
